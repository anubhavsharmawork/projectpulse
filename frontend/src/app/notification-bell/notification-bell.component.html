<div class="notification-wrapper">
      <button class="notification-btn"
              (click)="toggle()"
              [attr.aria-expanded]="isOpen"
              [attr.aria-label]="'Notifications' + (unreadCount > 0 ? ', ' + unreadCount + ' unread' : '')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
        <span class="badge" *ngIf="unreadCount > 0" aria-hidden="true">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
      </button>

      <div class="notification-dropdown" *ngIf="isOpen" role="region" aria-label="Notifications panel">
        <div class="dropdown-header">
          <span>Notifications</span>
          <button class="mark-all-btn" (click)="markAllRead()" *ngIf="notifications.length > 0"
                  aria-label="Mark all notifications as read">Mark all read</button>
        </div>
        <div class="notification-list" role="list">
          <div *ngFor="let n of notifications" class="notification-item"
               [class.unread]="!n.isRead"
               (click)="onItemClick(n)"
               (keydown.enter)="onItemClick(n)"
               tabindex="0"
               role="listitem">
            <div class="notification-row">
              <span class="notification-type-icon" [ngSwitch]="n.type" aria-hidden="true">
                <svg *ngSwitchCase="'StateTransition'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                <svg *ngSwitchCase="'AssignmentChange'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <svg *ngSwitchCase="'OverdueTask'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                <svg *ngSwitchCase="'Mention'" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                <svg *ngSwitchDefault width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
              </span>
              <div class="notification-content">
                <div class="notification-message">{{ n.message }}</div>
                <div class="notification-time">{{ formatTime(n.createdAt) }}</div>
              </div>
            </div>
          </div>
          <div *ngIf="notifications.length === 0" class="empty-state">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#cbd5e1" stroke-width="2" aria-hidden="true">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 01-3.46 0"/>
            </svg>
            <p>No unread notifications</p>
          </div>
        </div>
      </div>
    </div>
