codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "60...100"
  status:
    project:
      default:
        target: 90%
        threshold: 2%
      backend:
        target: 85%
        threshold: 2%
        flags:
          - backend
      frontend:
        target: 90%
        threshold: 2%
        flags:
          - frontend
    patch:
      default:
        target: 85%
        threshold: 2%

flags:
  backend:
    paths:
      - src/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

ignore:
  - "tests/**/*"
  - "src/**/Migrations/**"
  - "src/API/Program.cs"
  - "src/API/Controllers/OpsController.cs"
  - "src/API/Hubs/ProjectHub.cs"
  - "src/Infrastructure/DependencyInjection.cs"
  - "src/Infrastructure/Storage/S3StorageService.cs"
  - "src/Infrastructure/Persistence/AppDbSeeder.cs"
  - "frontend/src/main.ts"
  - "frontend/src/polyfills.ts"
  - "frontend/src/test.ts"
